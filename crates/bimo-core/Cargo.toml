[package]
name = "bimo_core"
version = "0.1.0"
edition = "2024"

[dependencies]
aisdk = { version = "0.5", features = ["openai", "anthropic", "google", "openaicompatible", "prompt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = "0.8"
tera = "1"
glob = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
