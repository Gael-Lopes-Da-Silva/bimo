[package]
name = "bimo"
version = "0.1.0"
edition = "2024"

[dependencies]
bimo_core = { path = "../bimo-core" }
bimo_tui = { path = "../bimo-tui" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.5", features = ["derive"] }
anyhow = "1"