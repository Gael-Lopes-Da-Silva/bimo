[package]
name = "bimo_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
bimo_core = { path = "../bimo-core" }
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
