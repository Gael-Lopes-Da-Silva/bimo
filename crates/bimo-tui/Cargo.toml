[package]
name = "bimo_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
bimo_core = { path = "../bimo-core" }
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tuie = { version = "0.2.4", features = ["harmonious"] }
