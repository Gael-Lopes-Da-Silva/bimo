[package]
name = "bimo_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
bimo_core = { path = "../bimo-core" }
clap = { version = "4.6.5", features = ["derive"] }
cursive = { version = "0.21.1", features = ["crossterm-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6"
thiserror = "2"
pulldown-cmark = "0.12"
walkdir = "2"

[dev-dependencies]
tempfile = "3"