[package]
name = "bimo_core"
version = "0.1.0"
edition = "2024"

[dependencies]
aisdk = { version = "0.5", features = ["openaicompatible", "anthropic"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dirs = "6"
regex = "1"
futures = "0.3"
