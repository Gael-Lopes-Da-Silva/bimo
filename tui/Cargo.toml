[package]
name = "bimo_tui"
version = "0.1.0"
edition = "2024"
description = "Bimo TUI — a terminal interface for the Bimo coding agent"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
