[package]
name = "bimo_tui"
version = "0.1.0"
edition = "2024"
description = "Bimo TUI — terminal user interface"

[dependencies]
bimo_api = { path = "../api" }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde_json = "1"
arboard = "3"
